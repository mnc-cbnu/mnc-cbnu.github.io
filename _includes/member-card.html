<div class="member-card"
    style="display: flex; align-items: center; width: 100%; border: 1px solid #eaeaea; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); background: #fff;">
    <img src="{{ member.image | default: '/assets/img/default.jpg' }}" alt="{{ member.name }}"
        style="border-radius: 50%; width: 96px; height: 96px; object-fit: cover;"
        onerror="this.onerror=null;this.src='/assets/img/default.jpg';" />

    <div class="member-info" style="margin-left: 20px; flex: 1;">
        <div class="member-name" style="font-size: 18px; font-weight: bold; margin-bottom: 4px;">{{ member.name }}</div>
        <div class="member-role" style="font-size: 14px; color: #555; margin-bottom: 8px;">
            {{ member.role }} {% if member.year %}(Class of {{ member.year }}){% endif %}
        </div>

        {% if member.email.size > 0 %}
        <div class="member-email" style="font-size: 13px; color: #777; margin-bottom: 2px;">📧 {{ member.email }}</div>
        {% endif %}

        {% if member.affiliation.size > 0 %}
        <div class="member-affiliation" style="font-size: 13px; color: #777;">📍 {{ member.affiliation }}</div>
        {% endif %}
    </div>

    {% if member.company_logo.size > 0 %}
    <img src="{{ member.company_logo | relative_url }}" alt="Company Logo"
        style="max-width: 120px; max-height: 100px; width: auto; height: auto; object-fit: contain;" />
    {% endif %}
</div>
