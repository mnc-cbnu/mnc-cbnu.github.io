<div class="member-card" style="display: flex; align-items: center; width: 100%;">
  <img src="{{ member.image | default: '/assets/img/default.jpg' }}" alt="{{ member.name }}"
    style="border-radius: 50%; width: 96px; height: 96px; object-fit: cover;"
    onerror="this.onerror=null;this.src='/assets/img/default.jpg';" />

  <div class="member-info" style="margin-left: 16px;">
    <div class="member-name" style="font-size: 16px; font-weight: 600;">{{ member.name }}</div>
    <div class="member-role" style="font-size: 14px; color: #555;">
      {{ member.role }} {% if member.year %}(Class of {{ member.year }}){% endif %}
    </div>
    {% if member.email.size > 0 %}
    <div class="member-email" style="font-size: 13px; color: #777;">✉️ {{ member.email }}</div>
    {% endif %}

    {% if member.affiliation.size > 0 %}
    <div class="member-affiliation" style="font-size: 13px; color: #777;">📍 {{ member.affiliation }}</div>
    {% endif %}
  </div>

  {% if member.company_logo %}
  <img src="{{ member.company_logo | relative_url }}" alt="Company Logo"
    style="margin-left: auto; width: 80px; height: auto; object-fit: contain; border-radius: 0; background: transparent; padding-right: 10px;">
  {% endif %}
</div>
