<style>
    /* Footer 배경과 글씨색 디자인 */
    .site-footer {
        background-color: #1a1a1a;
        /* 진한 검은색 배경 */
        color: #cccccc;
        padding: 50px 20px 20px;
        margin-top: 60px;
        /* 본문과 꼬리말 사이 여백 */
        font-size: 14px;
        line-height: 1.6;
    }

    /* 양옆으로 나란히 배치하기 위한 컨테이너 */
    .footer-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 50px;
        flex-wrap: wrap;
        /* 화면이 좁아지면 밑으로 떨어짐 */
    }

    /* 각 단(Column)의 스타일 */
    .footer-col {
        flex: 1;
        /* 남은 공간을 똑같이 나눠 가짐 */
        min-width: 250px;
    }

    /* Footer 안의 제목(MNC Lab, Contact Us 등) 스타일 */
    .footer-col h3 {
        color: #ffffff;
        margin-bottom: 20px;
        font-size: 18px;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
        margin-top: 0;
    }

    /* 맨 밑 저작권 표시 영역 */
    .footer-bottom {
        max-width: 1200px;
        margin: 40px auto 0;
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #333;
        color: #777;
        font-size: 13px;
    }
</style>

<footer class="site-footer">
    <div class="footer-container">
        {% for section in site.data.footer %}
        <div class="footer-col">
            <h3>{{ section[0] }}</h3>
            <div>{{ section[1] | markdownify }}</div>
        </div>
        {% endfor %}
    </div>

    <div class="footer-bottom">
        © {{ site.time | date: "%Y" }} MNC Lab. All rights reserved.
    </div>
</footer>
