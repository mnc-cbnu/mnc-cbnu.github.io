- - Welcome to MNC Lab
  - "Mobile Networking & Computing Lab (MNCLAB) designs and implements network architectures
    and communication protocols in a variety of wireless and mobile networks.

    Our research areas is routing, mobility, location service, QoS (Reliability and
    Real-time), multicasting, and object tracking in Internet of Things (Wireless
    Sensor Networks, Smart Grid, M2M, etc.), Future Networking (Information Centric
    Networking, Mobile Cloud Computing), Mobile Social Networks, etc.), and Wireless
    Networks (Vehicualr Networks, Airborne Networks, 5G Networks, etc.)."
